[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-resume-screener"
version = "0.1.0"
description = "Multi-agent resume screening pipeline (LangGraph + Gemini) served via FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shreyansh Dutt Mehra", email = "shreyanshduttmehra@gmail.com" }]
keywords = ["llm", "agents", "langgraph", "resume-screening", "fastapi", "gemini"]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12,<0.1",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langgraph>=0.2.50,<0.3",
    "langchain-core>=0.3.20,<0.4",
    "langchain-google-genai>=2.0.5,<3.0",
    "pypdf>=5.1,<6.0",
]

[project.optional-dependencies]
# 使用 `pip install -e ".[groq]"` 启用 Groq 提供商。
groq = ["langchain-groq>=0.2,<0.3"]
# 使用 `pip install -e ".[dev]"` 安装测试/静态检查工具链。
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]

[project.urls]
Repository = "https://github.com/ShreyanshMehra/multi-agent-resume-screener"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_agent_resume_screener = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
