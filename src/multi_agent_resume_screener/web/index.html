<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>multi-agent-resume-screener — 简历筛选</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>multi-agent-resume-screener</h1>
      <p class="tagline">
        多智能体简历筛选：对照职位描述排序打分，给出逐板块理由，并提供两条
        反馈轨道——需要长期积累的技能，以及可以立即完成的简历修改。
      </p>
    </div>
  </header>

  <main class="container">
    <section class="card form-card">
      <form id="screen-form">
        <div class="field">
          <label for="jd">职位描述（JD）</label>
          <textarea id="jd" name="jd" rows="7"
            placeholder="在此粘贴完整的职位描述……" required></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="mode">模式</label>
            <select id="mode" name="mode">
              <option value="candidate">候选人 — 优化我的简历</option>
              <option value="recruiter">招聘者 — 给简历排序</option>
            </select>
          </div>

          <div class="field">
            <label for="critic_mode">评审（Critic）</label>
            <select id="critic_mode" name="critic_mode">
              <option value="full">完整 — 每份简历都评审</option>
              <option value="fast">快速 — 仅评审头部候选人</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="resumes">简历 PDF（可多选）</label>
          <input type="file" id="resumes" name="resumes" accept="application/pdf"
            multiple required />
          <p class="hint">候选人模式：仅选择一份 PDF。招聘者模式：可同时选择多份。</p>
        </div>

        <button type="submit" id="submit-btn" class="btn">开始筛选</button>
      </form>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="results" class="results"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>基于 LangGraph + FastAPI 构建。</span>
      <a href="/docs">API 文档</a>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
